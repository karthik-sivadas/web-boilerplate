name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: web_boilerplate_test_admin
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture -d web_boilerplate_test_admin"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Disposable runner-only fixture, never a deployment credential.
      TEST_DATABASE_URL: postgresql://fixture:ephemeral-ci-only@127.0.0.1:5432/web_boilerplate_test_admin
      PG_TEST_ADMIN_URL: postgresql://fixture:ephemeral-ci-only@127.0.0.1:5432/web_boilerplate_test_admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-diagnostics
          path: |
            playwright-report
            test-results
            coverage
          if-no-files-found: ignore
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:docker
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-verification-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
